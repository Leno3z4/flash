name: Supply Chain Security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1

      - name: Verify dependency source policy
        run: python3 scripts/check_dependency_sources.py

      - name: Verify locked dependency graph
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check Rust code
        run: cargo check --locked

      - name: Run Rust tests
        run: cargo test --locked

  workflow-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Reject mutable third-party action tags
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re

          mutable = []
          for path in pathlib.Path('.github/workflows').glob('*.yml'):
              text = path.read_text(encoding='utf-8')
              for line_no, line in enumerate(text.splitlines(), 1):
                  match = re.search(r"\buses:\s*([^\s#]+)", line)
                  if not match:
                      continue
                  ref = match.group(1)
                  if '@' in ref and not re.fullmatch(r"[^@]+@[0-9a-fA-F]{40}", ref):
                      mutable.append(f"{path}:{line_no}: {ref}")
          if mutable:
              print("Mutable workflow action references found:")
              print("\n".join(mutable))
              raise SystemExit(1)
          print("Workflow action pin policy: PASS")
          PY
