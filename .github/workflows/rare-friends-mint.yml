name: Rare Friends Genesis Mint

on:
  workflow_dispatch:
  schedule:
    - cron: '40 13 16 9 *'

permissions:
  contents: read

jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MINT_WALLET_KEY: ${{ secrets.MINT_WALLET_KEY }}
      MINT_RPC_URL: ${{ secrets.MINT_RPC_URL }}
      MINT_COLLECTION: rare-friends-genesis
      MINT_TARGET_DATE: 2026-09-16
      MINT_INTERACTION_TIMEOUT_SECONDS: 2700
      MINT_DRY_RUN: '0'
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify required secrets are present
        shell: bash
        run: |
          test -n "$MINT_WALLET_KEY" || { echo "MINT_WALLET_KEY is missing"; exit 1; }
          test -n "$MINT_RPC_URL" || { echo "MINT_RPC_URL is missing"; exit 1; }

      - name: Verify configured RPC is Robinhood Chain mainnet
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          payload = json.dumps({
              "jsonrpc": "2.0",
              "id": 1,
              "method": "eth_chainId",
              "params": [],
          }).encode()
          request = urllib.request.Request(
              os.environ["MINT_RPC_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              result = json.load(response)
          chain_id = int(result["result"], 16)
          print(f"RPC chain_id={chain_id}")
          if chain_id != 4663:
              raise SystemExit(f"Wrong network: expected Robinhood Chain mainnet (4663), got {chain_id}")
          PY

      - name: Stop one-shot schedule after target date
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          test "$(date -u +%F)" = "2026-09-16" || {
            echo "Scheduled target date has passed; exiting without minting."
            exit 0
          }

      - name: Build opensea-mint
        run: cargo build --release --locked --bin opensea-mint

      - name: Run Rare Friends mint runner
        run: python3 cloudflare/mint_runner.py
