name: Rare Friends Genesis Mint

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run a safe preflight dry-run or the live mint'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - live
  schedule:
    - cron: '25 13 16 9 *'

permissions:
  contents: read

jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MINT_WALLET_KEY: ${{ secrets.MINT_WALLET_KEY }}
      MINT_RPC_URL: ${{ secrets.MINT_RPC_URL }}
      MINT_COLLECTION: rare-friends-genesis
      MINT_TARGET_DATE: 2026-09-16
      MINT_INTERACTION_TIMEOUT_SECONDS: 2700
      MINT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' && '1' || '0' }}
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify required secrets are present
        shell: bash
        run: |
          test -n "$MINT_WALLET_KEY" || { echo "MINT_WALLET_KEY is missing"; exit 1; }
          test -n "$MINT_RPC_URL" || { echo "MINT_RPC_URL is missing"; exit 1; }

      - name: Stop one-shot schedule after target date
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          test "$(date -u +%F)" = "2026-09-16" || {
            echo "Scheduled target date has passed; exiting without minting."
            exit 0
          }

      - name: Show selected mode
        shell: bash
        run: |
          if [ "$MINT_DRY_RUN" = "1" ]; then
            echo "Workflow mode: dry-run"
          else
            echo "Workflow mode: live"
          fi

      - name: Build opensea-mint
        run: cargo build --release --locked --bin opensea-mint

      - name: Run Rare Friends mint runner
        run: python3 cloudflare/mint_runner.py
